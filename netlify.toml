# Configuration de déploiement Netlify pour Excel Académie.
# Le code de l'app est dans le sous-dossier app/ (Vite). Les chapitres JSON
# sont à la racine du dépôt (un niveau au-dessus de app/), importés par l'app.

[build]
  base = "app"               # Netlify lance le build dans app/
  command = "npm run build"  # Vite compile vers app/dist
  publish = "dist"           # dossier publié (relatif à base = app/dist)

[build.environment]
  NODE_VERSION = "20"

# Fonctions serveur (paiement Stripe). Dossier relatif à base = app/netlify/functions.
# Endpoints : /.netlify/functions/creer-paiement et /.netlify/functions/webhook-stripe.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Single Page App : tout passe par index.html (pas de routage serveur).
# (Les routes /.netlify/functions/* sont servies par le runtime des fonctions,
# elles ne sont pas capturées par cette redirection.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes de sécurité de base (anti-clickjacking, anti-sniffing MIME, referrer limité).
# Pas de Content-Security-Policy pour l'instant : l'app utilise beaucoup de styles
# inline (style={{...}}) qu'une CSP stricte casserait sans tests approfondis d'abord.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Force le navigateur à n'utiliser que HTTPS pendant 2 ans, y compris si
    # quelqu'un tape l'adresse en http:// ou clique un vieux lien.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # L'app n'a besoin ni de caméra, ni de micro, ni de position, ni de paiement
    # natif : on les refuse explicitement, pour l'app comme pour tout iframe.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=()"
